<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1800" height="520" viewBox="0 0 1800 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #4b5563; }
      .step { font: 700 13px Arial, sans-serif; fill: #64748b; letter-spacing: 0.04em; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .aws { fill: #FF9900; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
                    flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>

  <text x="900" y="48" text-anchor="middle" class="title">
    Integration workflow
  </text>

  <!-- Prepare CSV feed -->
  <g transform="translate(40,145)" filter="url(#shadow)">
    <rect class="box" width="185" height="170"/>
    <text x="22" y="26" class="step">STEP 1</text>

    <rect x="62" y="42" width="62" height="74" rx="6" fill="#64748b"/>
    <polygon points="108,42 124,58 108,58" fill="#cbd5e1"/>
    <line x1="76" y1="72" x2="110" y2="72" stroke="#f8fafc" stroke-width="4"/>
    <line x1="76" y1="88" x2="110" y2="88" stroke="#f8fafc" stroke-width="4"/>
    <line x1="76" y1="104" x2="100" y2="104" stroke="#f8fafc" stroke-width="4"/>

    <text x="92.5" y="144" text-anchor="middle" class="label">
      Prepare CSV
    </text>
    <text x="92.5" y="166" text-anchor="middle" class="label">
      feed
    </text>
  </g>

  <!-- Upload feed -->
  <g transform="translate(260,145)" filter="url(#shadow)">
    <rect class="box" width="185" height="170"/>
    <text x="22" y="26" class="step">STEP 2</text>

    <rect x="46" y="44" width="92" height="56" rx="10" fill="#0f766e"/>
    <text x="92.5" y="78" text-anchor="middle"
          style="font:700 16px Arial; fill:white;">
      API
    </text>

    <text x="92.5" y="144" text-anchor="middle" class="label">
      Upload feed
    </text>
    <text x="92.5" y="166" text-anchor="middle" class="small">
      Feed Upload API
    </text>
  </g>

  <!-- Validate feed -->
  <g transform="translate(480,145)" filter="url(#shadow)">
    <rect class="box" width="185" height="170"/>
    <text x="22" y="26" class="step">STEP 3</text>

    <rect x="54" y="40" width="78" height="70" rx="10" fill="#7c3aed"/>
    <line x1="70" y1="60" x2="116" y2="60" stroke="#ede9fe" stroke-width="4"/>
    <line x1="70" y1="76" x2="116" y2="76" stroke="#ede9fe" stroke-width="4"/>
    <line x1="70" y1="92" x2="104" y2="92" stroke="#ede9fe" stroke-width="4"/>

    <text x="92.5" y="144" text-anchor="middle" class="label">
      Validate feed
    </text>
    <text x="92.5" y="166" text-anchor="middle" class="small">
      Validation job
    </text>
  </g>

  <!-- Run ETL -->
  <g transform="translate(700,145)" filter="url(#shadow)">
    <rect class="box" width="185" height="170"/>
    <text x="22" y="26" class="step">STEP 4</text>

    <rect x="45" y="46" width="96" height="58" rx="10" class="aws"/>
    <path d="M66 65 L88 65 L88 57 L116 75 L88 93 L88 85 L66 85 Z"
          fill="#fff3e0"/>

    <text x="92.5" y="144" text-anchor="middle" class="label">
      Run ETL
    </text>
    <text x="92.5" y="166" text-anchor="middle" class="small">
      Processing job
    </text>
  </g>

  <!-- Store products -->
  <g transform="translate(920,145)" filter="url(#shadow)">
    <rect class="box" width="185" height="170"/>
    <text x="22" y="26" class="step">STEP 5</text>

    <ellipse cx="92.5" cy="56" rx="38" ry="12" fill="#2563eb"/>
    <rect x="54.5" y="56" width="76" height="46" fill="#2563eb"/>
    <ellipse cx="92.5" cy="102" rx="38" ry="12" fill="#1d4ed8"/>

    <text x="92.5" y="144" text-anchor="middle" class="label">
      Store products
    </text>
    <text x="92.5" y="166" text-anchor="middle" class="small">
      PostgreSQL / RDS
    </text>
  </g>

  <!-- Retrieve product data -->
  <g transform="translate(1140,145)" filter="url(#shadow)">
    <rect class="box" width="185" height="170"/>
    <text x="22" y="26" class="step">STEP 6</text>

    <rect x="46" y="44" width="92" height="56" rx="10" fill="#0f766e"/>
    <text x="92.5" y="78" text-anchor="middle"
          style="font:700 16px Arial; fill:white;">
      API
    </text>

    <text x="92.5" y="136" text-anchor="middle" class="label">
      Retrieve
    </text>
    <text x="92.5" y="158" text-anchor="middle" class="label">
      product data
    </text>
  </g>

  <!-- Create order -->
  <g transform="translate(1360,145)" filter="url(#shadow)">
    <rect class="box" width="185" height="170"/>
    <text x="22" y="26" class="step">STEP 7</text>

    <rect x="46" y="44" width="92" height="56" rx="10" fill="#0f766e"/>
    <text x="92.5" y="78" text-anchor="middle"
          style="font:700 16px Arial; fill:white;">
      API
    </text>

    <text x="92.5" y="144" text-anchor="middle" class="label">
      Create order
    </text>
    <text x="92.5" y="166" text-anchor="middle" class="small">
      Orders API
    </text>
  </g>

  <!-- Retrieve analytics -->
  <g transform="translate(1580,145)" filter="url(#shadow)">
    <rect class="box" width="185" height="170"/>
    <text x="22" y="26" class="step">STEP 8</text>

    <rect x="46" y="42" width="92" height="58" rx="10" fill="#ea580c"/>
    <polyline points="64,82 80,66 96,74 116,56"
              fill="none" stroke="#fff7ed" stroke-width="4"/>

    <text x="92.5" y="136" text-anchor="middle" class="label">
      Retrieve
    </text>
    <text x="92.5" y="158" text-anchor="middle" class="label">
      analytics
    </text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M225 230 L260 230"/>
  <path class="arrow" d="M445 230 L480 230"/>
  <path class="arrow" d="M665 230 L700 230"/>
  <path class="arrow" d="M885 230 L920 230"/>
  <path class="arrow" d="M1105 230 L1140 230"/>
  <path class="arrow" d="M1325 230 L1360 230"/>
  <path class="arrow" d="M1545 230 L1580 230"/>

</svg>
