<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1700" height="760" viewBox="0 0 1700 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #4b5563; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .error-arrow { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#errorhead); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .aws { fill: #FF9900; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>

    <marker id="errorhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>

  <text x="850" y="50" text-anchor="middle" class="title">
    Ingestion and order flow
  </text>

  <!-- Row 1 -->

  <!-- Partner upload -->
  <g transform="translate(40,120)" filter="url(#shadow)">
    <rect class="box" width="210" height="170"/>

    <rect x="60" y="24" width="90" height="58" rx="8" fill="#2563eb"/>
    <rect x="70" y="34" width="70" height="38" fill="#dbeafe"/>
    <rect x="92" y="88" width="26" height="8" rx="3" fill="#2563eb"/>

    <text x="105" y="126" text-anchor="middle" class="label">
      Partner CSV upload
    </text>
  </g>

  <!-- S3 -->
  <g transform="translate(320,120)" filter="url(#shadow)">
    <rect class="box" width="210" height="170"/>

    <ellipse cx="105" cy="40" rx="40" ry="12" class="aws"/>
    <rect x="65" y="40" width="80" height="46" class="aws"/>
    <ellipse cx="105" cy="86" rx="40" ry="12" fill="#e87900"/>

    <text x="105" y="122" text-anchor="middle" class="label">
      Raw layer
    </text>
    <text x="105" y="146" text-anchor="middle" class="small">
      Amazon S3
    </text>
  </g>

  <!-- Validation -->
  <g transform="translate(600,120)" filter="url(#shadow)">
    <rect class="box" width="210" height="170"/>

    <rect x="58" y="24" width="94" height="64" rx="12" class="aws"/>
    <rect x="78" y="42" width="54" height="28" rx="5" fill="#fff3e0"/>
    <circle cx="90" cy="56" r="4" fill="#FF9900"/>
    <circle cx="106" cy="56" r="4" fill="#FF9900"/>
    <circle cx="122" cy="56" r="4" fill="#FF9900"/>

    <text x="105" y="122" text-anchor="middle" class="label">
      Validation layer
    </text>
    <text x="105" y="146" text-anchor="middle" class="small">
      ECS / FastAPI
    </text>
  </g>

  <!-- ETL -->
  <g transform="translate(880,120)" filter="url(#shadow)">
    <rect class="box" width="210" height="170"/>

    <rect x="56" y="26" width="98" height="60" rx="10" fill="#7c3aed"/>
    <path d="M76 46 L98 46 L98 38 L124 56 L98 74 L98 66 L76 66 Z"
          fill="#ede9fe"/>

    <text x="105" y="122" text-anchor="middle" class="label">
      ETL processing
    </text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(1160,120)" filter="url(#shadow)">
    <rect class="box" width="210" height="170"/>

    <ellipse cx="105" cy="38" rx="40" ry="12" fill="#2563eb"/>
    <rect x="65" y="38" width="80" height="52" fill="#2563eb"/>
    <ellipse cx="105" cy="90" rx="40" ry="12" fill="#1d4ed8"/>

    <text x="105" y="122" text-anchor="middle" class="label">
      Product catalog
    </text>
    <text x="105" y="146" text-anchor="middle" class="small">
      PostgreSQL / RDS
    </text>
  </g>

  <!-- Row 2 -->

  <!-- Products API -->
  <g transform="translate(320,430)" filter="url(#shadow)">
    <rect class="box" width="210" height="150"/>

    <rect x="58" y="24" width="94" height="56" rx="10" fill="#0f766e"/>
    <text x="105" y="58" text-anchor="middle"
          style="font:700 16px Arial; fill:white;">
      API
    </text>

    <text x="105" y="110" text-anchor="middle" class="label">
      Products API
    </text>
  </g>

  <!-- Orders API -->
  <g transform="translate(600,430)" filter="url(#shadow)">
    <rect class="box" width="210" height="150"/>

    <rect x="58" y="24" width="94" height="56" rx="10" fill="#0f766e"/>
    <text x="105" y="58" text-anchor="middle"
          style="font:700 16px Arial; fill:white;">
      API
    </text>

    <text x="105" y="110" text-anchor="middle" class="label">
      Orders API
    </text>
  </g>

  <!-- Orders DB -->
  <g transform="translate(880,430)" filter="url(#shadow)">
    <rect class="box" width="210" height="150"/>

    <ellipse cx="105" cy="38" rx="40" ry="12" fill="#2563eb"/>
    <rect x="65" y="38" width="80" height="52" fill="#2563eb"/>
    <ellipse cx="105" cy="90" rx="40" ry="12" fill="#1d4ed8"/>

    <text x="105" y="118" text-anchor="middle" class="label">
      Orders and
    </text>
    <text x="105" y="140" text-anchor="middle" class="label">
      order items
    </text>
  </g>

  <!-- Analytics -->
  <g transform="translate(1160,430)" filter="url(#shadow)">
    <rect class="box" width="210" height="150"/>

    <rect x="58" y="22" width="94" height="58" rx="10" fill="#ea580c"/>
    <polyline points="76,62 92,48 108,56 126,38"
              fill="none" stroke="#fff7ed" stroke-width="4"/>

    <text x="105" y="110" text-anchor="middle" class="label">
      Analytics API
    </text>
  </g>

  <!-- Error branch -->
  <g transform="translate(1420,120)" filter="url(#shadow)">
    <rect class="box" width="220" height="150"
          style="stroke:#fecaca; fill:#fff5f5;"/>

    <circle cx="110" cy="46" r="24" fill="#dc2626"/>
    <text x="110" y="54" text-anchor="middle"
          style="font:700 22px Arial; fill:white;">!</text>

    <text x="110" y="104" text-anchor="middle" class="label">
      Failed feed
    </text>
    <text x="110" y="128" text-anchor="middle" class="small">
      or failed job
    </text>
  </g>

  <!-- Debug -->
  <g transform="translate(1420,430)" filter="url(#shadow)">
    <rect class="box" width="220" height="150"/>

    <circle cx="94" cy="48" r="18" fill="#475569"/>
    <rect x="108" y="62" width="28" height="8"
          transform="rotate(45 108 62)" fill="#475569"/>

    <text x="110" y="112" text-anchor="middle" class="label">
      Debug workflow
    </text>
  </g>

  <!-- Main arrows -->
  <path class="arrow" d="M250 205 L320 205"/>
  <path class="arrow" d="M530 205 L600 205"/>
  <path class="arrow" d="M810 205 L880 205"/>
  <path class="arrow" d="M1090 205 L1160 205"/>

  <path class="arrow" d="M1265 290 L1265 350"/>
  <path class="arrow" d="M1265 350 L425 350"/>
  <path class="arrow" d="M425 350 L425 430"/>

  <path class="arrow" d="M530 505 L600 505"/>
  <path class="arrow" d="M810 505 L880 505"/>
  <path class="arrow" d="M1090 505 L1160 505"/>

  <!-- Error arrows -->
  <path class="error-arrow" d="M810 205 L1420 205"/>
  <path class="error-arrow" d="M1530 270 L1530 430"/>

</svg>
