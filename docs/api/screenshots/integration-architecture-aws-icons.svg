<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1800" height="860" viewBox="0 0 1800 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #4b5563; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .aws { fill: #FF9900; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
                    flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>

  <text x="900" y="48" text-anchor="middle" class="title">
    Integration architecture
  </text>

  <!-- Top Row -->

  <!-- Commerce Source -->
  <g transform="translate(40,120)" filter="url(#shadow)">
    <rect class="box" width="220" height="170"/>

    <rect x="62" y="24" width="96" height="58" rx="8" fill="#2563eb"/>
    <rect x="74" y="36" width="72" height="34" fill="#dbeafe"/>
    <rect x="96" y="88" width="28" height="8" rx="4" fill="#2563eb"/>

    <text x="110" y="128" text-anchor="middle" class="label">
      Commerce source
    </text>
  </g>

  <!-- Feed Upload API -->
  <g transform="translate(340,120)" filter="url(#shadow)">
    <rect class="box" width="220" height="170"/>

    <rect x="64" y="26" width="92" height="58" rx="10" fill="#0f766e"/>
    <text x="110" y="60" text-anchor="middle"
          style="font:700 16px Arial; fill:white;">
      API
    </text>

    <text x="110" y="128" text-anchor="middle" class="label">
      Feed upload API
    </text>
  </g>

  <!-- S3 -->
  <g transform="translate(640,60)" filter="url(#shadow)">
    <rect class="box" width="220" height="170"/>

    <ellipse cx="110" cy="42" rx="40" ry="12" class="aws"/>
    <rect x="70" y="42" width="80" height="46" class="aws"/>
    <ellipse cx="110" cy="88" rx="40" ry="12" fill="#e87900"/>

    <text x="110" y="126" text-anchor="middle" class="label">
      S3 raw storage
    </text>
  </g>

  <!-- Validation Job -->
  <g transform="translate(640,280)" filter="url(#shadow)">
    <rect class="box" width="220" height="170"/>

    <rect x="72" y="28" width="76" height="70" rx="10" fill="#7c3aed"/>
    <line x1="88" y1="48" x2="132" y2="48"
          stroke="#ede9fe" stroke-width="4"/>
    <line x1="88" y1="62" x2="132" y2="62"
          stroke="#ede9fe" stroke-width="4"/>
    <line x1="88" y1="76" x2="120" y2="76"
          stroke="#ede9fe" stroke-width="4"/>

    <text x="110" y="128" text-anchor="middle" class="label">
      Validation job
    </text>
  </g>

  <!-- ETL -->
  <g transform="translate(940,280)" filter="url(#shadow)">
    <rect class="box" width="220" height="170"/>

    <rect x="60" y="30" width="100" height="60"
          rx="10" fill="#7c3aed"/>
    <path d="M80 50 L102 50 L102 42 L128 60 L102 78 L102 70 L80 70 Z"
          fill="#ede9fe"/>

    <text x="110" y="128" text-anchor="middle" class="label">
      ETL processing
    </text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(1240,280)" filter="url(#shadow)">
    <rect class="box" width="220" height="170"/>

    <ellipse cx="110" cy="42" rx="40" ry="12" fill="#2563eb"/>
    <rect x="70" y="42" width="80" height="50" fill="#2563eb"/>
    <ellipse cx="110" cy="92" rx="40" ry="12" fill="#1d4ed8"/>

    <text x="110" y="128" text-anchor="middle" class="label">
      PostgreSQL catalog
    </text>
  </g>

  <!-- Bottom Row -->

  <!-- Products API -->
  <g transform="translate(340,610)" filter="url(#shadow)">
    <rect class="box" width="220" height="150"/>

    <rect x="64" y="24" width="92" height="56"
          rx="10" fill="#0f766e"/>
    <text x="110" y="58" text-anchor="middle"
          style="font:700 16px Arial; fill:white;">
      API
    </text>

    <text x="110" y="112" text-anchor="middle" class="label">
      Products API
    </text>
  </g>

  <!-- Orders API -->
  <g transform="translate(640,610)" filter="url(#shadow)">
    <rect class="box" width="220" height="150"/>

    <rect x="64" y="24" width="92" height="56"
          rx="10" fill="#0f766e"/>
    <text x="110" y="58" text-anchor="middle"
          style="font:700 16px Arial; fill:white;">
      API
    </text>

    <text x="110" y="112" text-anchor="middle" class="label">
      Orders API
    </text>
  </g>

  <!-- Orders DB -->
  <g transform="translate(940,610)" filter="url(#shadow)">
    <rect class="box" width="220" height="150"/>

    <ellipse cx="110" cy="42" rx="40" ry="12" fill="#2563eb"/>
    <rect x="70" y="42" width="80" height="50" fill="#2563eb"/>
    <ellipse cx="110" cy="92" rx="40" ry="12" fill="#1d4ed8"/>

    <text x="110" y="112" text-anchor="middle" class="label">
      Orders and
    </text>
    <text x="110" y="136" text-anchor="middle" class="label">
      order items
    </text>
  </g>

  <!-- Analytics -->
  <g transform="translate(1240,610)" filter="url(#shadow)">
    <rect class="box" width="220" height="150"/>

    <rect x="64" y="24" width="92" height="56"
          rx="10" fill="#ea580c"/>

    <polyline points="82,64 98,48 114,56 132,38"
              fill="none" stroke="#fff7ed" stroke-width="4"/>

    <text x="110" y="112" text-anchor="middle" class="label">
      Analytics API
    </text>
  </g>

  <!-- Revenue Reporting -->
  <g transform="translate(1540,610)" filter="url(#shadow)">
    <rect class="box" width="220" height="150"/>

    <rect x="62" y="26" width="96" height="58"
          rx="10" fill="#0284c7"/>

    <polyline points="78,66 96,52 114,58 134,40"
              fill="none" stroke="#e0f2fe" stroke-width="4"/>

    <text x="110" y="112" text-anchor="middle" class="label">
      Revenue reporting
    </text>
  </g>

  <!-- Arrows -->

  <!-- top flow -->
  <path class="arrow" d="M260 205 L340 205"/>
  <path class="arrow" d="M560 205 L640 145"/>
  <path class="arrow" d="M560 205 L640 365"/>
  <path class="arrow" d="M860 365 L940 365"/>
  <path class="arrow" d="M1160 365 L1240 365"/>

  <!-- down to APIs -->
  <path class="arrow" d="M1350 450 L1350 540"/>
  <path class="arrow" d="M1350 540 L450 540"/>
  <path class="arrow" d="M450 540 L450 610"/>

  <!-- api flow -->
  <path class="arrow" d="M560 685 L640 685"/>
  <path class="arrow" d="M860 685 L940 685"/>
  <path class="arrow" d="M1160 685 L1240 685"/>
  <path class="arrow" d="M1460 685 L1540 685"/>

</svg>
