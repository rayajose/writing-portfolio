<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1500" height="520" viewBox="0 0 1500 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #4b5563; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .aws { fill: #FF9900; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>

  <text x="750" y="48" text-anchor="middle" class="title">
    Feed ingestion data flow
  </text>

  <!-- Step 1 -->
  <g transform="translate(40,140)" filter="url(#shadow)">
    <rect class="box" width="220" height="180"/>

    <!-- Client icon -->
    <rect x="65" y="24" width="90" height="58" rx="8" fill="#2563eb"/>
    <rect x="75" y="34" width="70" height="38" fill="#dbeafe"/>
    <rect x="95" y="88" width="30" height="8" rx="3" fill="#2563eb"/>

    <text x="110" y="122" text-anchor="middle" class="label">
      Client request
    </text>
    <text x="110" y="146" text-anchor="middle" class="small">
      POST /feeds/upload
    </text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(320,140)" filter="url(#shadow)">
    <rect class="box" width="220" height="180"/>

    <!-- ECS icon -->
    <rect x="58" y="22" width="104" height="72" rx="12" class="aws"/>
    <rect x="78" y="40" width="64" height="36" rx="6" fill="#fff3e0"/>
    <circle cx="90" cy="58" r="5" fill="#FF9900"/>
    <circle cx="110" cy="58" r="5" fill="#FF9900"/>
    <circle cx="130" cy="58" r="5" fill="#FF9900"/>

    <text x="110" y="122" text-anchor="middle" class="label">
      Validate upload
    </text>
    <text x="110" y="146" text-anchor="middle" class="small">
      FastAPI / ECS
    </text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(600,140)" filter="url(#shadow)">
    <rect class="box" width="220" height="180"/>

    <!-- S3 bucket -->
    <ellipse cx="110" cy="42" rx="42" ry="14" class="aws"/>
    <rect x="68" y="42" width="84" height="48" class="aws"/>
    <ellipse cx="110" cy="90" rx="42" ry="14" fill="#e87900"/>

    <text x="110" y="122" text-anchor="middle" class="label">
      Store raw file
    </text>
    <text x="110" y="146" text-anchor="middle" class="small">
      Amazon S3
    </text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(880,140)" filter="url(#shadow)">
    <rect class="box" width="220" height="180"/>

    <!-- RDS/Postgres -->
    <ellipse cx="110" cy="38" rx="40" ry="12" fill="#2563eb"/>
    <rect x="70" y="38" width="80" height="52" fill="#2563eb"/>
    <ellipse cx="110" cy="90" rx="40" ry="12" fill="#1d4ed8"/>

    <text x="110" y="122" text-anchor="middle" class="label">
      Create feed record
    </text>
    <text x="110" y="146" text-anchor="middle" class="small">
      PostgreSQL / RDS
    </text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(1160,140)" filter="url(#shadow)">
    <rect class="box" width="220" height="180"/>

    <!-- Job icon -->
    <rect x="72" y="24" width="76" height="72" rx="10" fill="#7c3aed"/>
    <line x1="88" y1="44" x2="132" y2="44" stroke="#ede9fe" stroke-width="4"/>
    <line x1="88" y1="58" x2="132" y2="58" stroke="#ede9fe" stroke-width="4"/>
    <line x1="88" y1="72" x2="120" y2="72" stroke="#ede9fe" stroke-width="4"/>

    <text x="110" y="122" text-anchor="middle" class="label">
      Create job records
    </text>
    <text x="110" y="146" text-anchor="middle" class="small">
      Validation + ETL jobs
    </text>
  </g>

  <!-- Final response -->
  <g transform="translate(1160,360)" filter="url(#shadow)">
    <rect class="box" width="220" height="100"/>

    <text x="110" y="44" text-anchor="middle" class="label">
      Return upload
    </text>
    <text x="110" y="68" text-anchor="middle" class="small">
      Feed ID + Job IDs
    </text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M260 230 L320 230"/>
  <path class="arrow" d="M540 230 L600 230"/>
  <path class="arrow" d="M820 230 L880 230"/>
  <path class="arrow" d="M1100 230 L1160 230"/>
  <path class="arrow" d="M1270 320 L1270 360"/>

</svg>
