<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <!-- <title id="title">Commerce Integration API high-level architecture</title> -->
  <!-- <desc id="desc">High-level architecture showing client applications connecting through an application load balancer to an ECS Fargate FastAPI application, with raw feed storage in S3, ETL processing, PostgreSQL storage in RDS, and an analytics layer.</desc> -->

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>

    <style>
      .bg { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .boundary-title { font: 700 24px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .boundary-subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #64748b; }

      .card { filter: url(#shadow); }
      .service { fill: #ffffff; stroke-width: 2; }
      .compute { stroke: #2563eb; }
      .storage { stroke: #059669; }
      .process { stroke: #ea580c; }
      .external { stroke: #64748b; }

      .accent-compute { fill: #eff6ff; }
      .accent-storage { fill: #ecfdf5; }
      .accent-process { fill: #fff7ed; }
      .accent-external { fill: #f1f5f9; }

      .label { font: 700 19px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #475569; }
      .caption { font: 600 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.25; marker-end: url(#arrow); }
      .connector-label { font: 600 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; }
      .icon-line { stroke: #0f172a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: .75; }
      .icon-fill { fill: #0f172a; opacity: .75; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>

  <!-- Header 
  <text x="700" y="66" text-anchor="middle" style="font:700 34px Arial, Helvetica, sans-serif; fill:#0f172a;">High-level architecture</text>
  <text x="700" y="98" text-anchor="middle" style="font:400 16px Arial, Helvetica, sans-serif; fill:#64748b;">Commerce Integration API: ingestion, processing, storage, and analytics</text>-->

  <!-- External client -->
  <g class="card">
    <rect x="72" y="365" width="235" height="150" rx="18" class="service external"/>
    <rect x="72" y="365" width="235" height="44" rx="18" class="accent-external"/>
    <path d="M72 391 Q72 365 98 365 H281 Q307 365 307 391 V409 H72 Z" class="accent-external"/>
    <text x="189.5" y="393" text-anchor="middle" class="caption">EXTERNAL</text>

    <!-- Client icon -->
    <rect x="108" y="430" width="62" height="42" rx="4" class="icon-line"/>
    <path d="M112 480 H166" class="icon-line"/>
    <path d="M126 489 H152" class="icon-line"/>
    <path d="M139 472 V489" class="icon-line"/>
    <text x="190" y="449" class="label">Client</text>
    <text x="190" y="473" class="small">curl / Postman</text>
    <text x="190" y="493" class="small">Swagger UI</text>
  </g>

  <!-- AWS environment boundary -->
  <rect x="365" y="150" width="955" height="650" rx="26" class="boundary"/>
  <text x="405" y="195" class="boundary-title">AWS cloud environment</text>
  <text x="405" y="220" class="boundary-subtitle">Managed application runtime, feed storage, relational data, and reporting services</text>

  <!-- ALB -->
  <g class="card">
    <rect x="435" y="300" width="235" height="145" rx="18" class="service compute"/>
    <rect x="435" y="300" width="235" height="44" rx="18" class="accent-compute"/>
    <path d="M435 326 Q435 300 461 300 H644 Q670 300 670 326 V344 H435 Z" class="accent-compute"/>
    <text x="552.5" y="328" text-anchor="middle" class="caption">NETWORK</text>

    <!-- ALB icon -->
    <circle cx="485" cy="378" r="26" class="icon-line"/>
    <path d="M466 378 H504" class="icon-line"/>
    <path d="M485 359 V397" class="icon-line"/>
    <path d="M471 364 C480 372 490 384 499 393" class="icon-line"/>
    <path d="M499 364 C490 372 480 384 471 393" class="icon-line"/>
    <text x="526" y="367" class="label">Application</text>
    <text x="526" y="391" class="label">Load Balancer</text>
    <text x="526" y="418" class="small">Routes API traffic</text>
  </g>

  <!-- ECS -->
  <g class="card">
    <rect x="760" y="300" width="250" height="145" rx="18" class="service compute"/>
    <rect x="760" y="300" width="250" height="44" rx="18" class="accent-compute"/>
    <path d="M760 326 Q760 300 786 300 H984 Q1010 300 1010 326 V344 H760 Z" class="accent-compute"/>
    <text x="885" y="328" text-anchor="middle" class="caption">COMPUTE</text>

    <!-- ECS icon -->
    <rect x="794" y="361" width="46" height="46" rx="8" class="icon-line"/>
    <path d="M803 375 H831" class="icon-line"/>
    <path d="M803 388 H831" class="icon-line"/>
    <path d="M803 401 H831" class="icon-line"/>
    <text x="858" y="365" class="label">ECS Fargate</text>
    <text x="858" y="391" class="small">FastAPI application</text>
    <text x="858" y="414" class="small">API, orchestration, auth</text>
  </g>

  <!-- S3 -->
  <g class="card">
    <rect x="435" y="570" width="235" height="145" rx="18" class="service storage"/>
    <rect x="435" y="570" width="235" height="44" rx="18" class="accent-storage"/>
    <path d="M435 596 Q435 570 461 570 H644 Q670 570 670 596 V614 H435 Z" class="accent-storage"/>
    <text x="552.5" y="598" text-anchor="middle" class="caption">OBJECT STORAGE</text>

    <!-- bucket icon -->
    <path d="M470 636 C470 626 507 626 507 636 V681 C507 692 470 692 470 681 Z" class="icon-line"/>
    <path d="M470 636 C470 646 507 646 507 636" class="icon-line"/>
    <text x="526" y="638" class="label">S3</text>
    <text x="526" y="663" class="small">Raw feed storage</text>
    <text x="526" y="686" class="small">CSV files and metadata</text>
  </g>

  <!-- ETL -->
  <g class="card">
    <rect x="760" y="570" width="250" height="145" rx="18" class="service process"/>
    <rect x="760" y="570" width="250" height="44" rx="18" class="accent-process"/>
    <path d="M760 596 Q760 570 786 570 H984 Q1010 570 1010 596 V614 H760 Z" class="accent-process"/>
    <text x="885" y="598" text-anchor="middle" class="caption">PROCESSING</text>

    <!-- ETL icon -->
    <path d="M796 652 H834" class="icon-line"/>
    <path d="M796 652 L808 640" class="icon-line"/>
    <path d="M796 652 L808 664" class="icon-line"/>
    <path d="M796 676 H834" class="icon-line"/>
    <path d="M834 676 L822 664" class="icon-line"/>
    <path d="M834 676 L822 688" class="icon-line"/>
    <text x="858" y="638" class="label">ETL processing</text>
    <text x="858" y="663" class="small">Validation and load jobs</text>
    <text x="858" y="686" class="small">Normalize product data</text>
  </g>

  <!-- DB -->
  <g class="card">
    <rect x="1080" y="570" width="235" height="145" rx="18" class="service storage"/>
    <rect x="1080" y="570" width="235" height="44" rx="18" class="accent-storage"/>
    <path d="M1080 596 Q1080 570 1106 570 H1289 Q1315 570 1315 596 V614 H1080 Z" class="accent-storage"/>
    <text x="1197.5" y="598" text-anchor="middle" class="caption">RELATIONAL DATA</text>

    <!-- DB icon -->
    <ellipse cx="1121" cy="636" rx="28" ry="10" class="icon-line"/>
    <path d="M1093 636 V680 C1093 694 1149 694 1149 680 V636" class="icon-line"/>
    <path d="M1093 658 C1093 672 1149 672 1149 658" class="icon-line"/>
    <path d="M1093 680 C1093 694 1149 694 1149 680" class="icon-line"/>
    <text x="1162" y="638" class="label">RDS</text>
    <text x="1162" y="663" class="small">PostgreSQL</text>
    <text x="1162" y="686" class="small">Feeds, jobs, products, orders</text>
  </g>

  <!-- Analytics -->
  <g class="card">
    <rect x="1080" y="300" width="235" height="145" rx="18" class="service process"/>
    <rect x="1080" y="300" width="235" height="44" rx="18" class="accent-process"/>
    <path d="M1080 326 Q1080 300 1106 300 H1289 Q1315 300 1315 326 V344 H1080 Z" class="accent-process"/>
    <text x="1197.5" y="328" text-anchor="middle" class="caption">REPORTING</text>

    <!-- Analytics icon -->
    <path d="M1100 397 H1147" class="icon-line"/>
    <path d="M1108 397 V377" class="icon-line"/>
    <path d="M1123 397 V361" class="icon-line"/>
    <path d="M1138 397 V370" class="icon-line"/>
    <text x="1162" y="367" class="label">Analytics layer</text>
    <text x="1162" y="392" class="small">Sales and revenue</text>
    <text x="1162" y="415" class="small">Aggregate queries</text>
  </g>

  <!-- Connectors -->
  <path d="M307 440 H435" class="connector"/>
  <rect x="334" y="416" width="78" height="28" rx="14" class="pill"/>
  <text x="373" y="435" text-anchor="middle" class="connector-label">HTTPS</text>

  <path d="M670 372.5 H760" class="connector"/>
  <rect x="691" y="348" width="50" height="28" rx="14" class="pill"/>
  <text x="716" y="367" text-anchor="middle" class="connector-label">route</text>

  <path d="M885 445 V570" class="connector"/>
  <rect x="811" y="495" width="148" height="28" rx="14" class="pill"/>
  <text x="885" y="514" text-anchor="middle" class="connector-label">start processing</text>

  <path d="M760 395 C705 395 704 642.5 670 642.5" class="connector"/>
  <rect x="648" y="507" width="110" height="28" rx="14" class="pill"/>
  <text x="703" y="526" text-anchor="middle" class="connector-label">store feeds</text>

  <path d="M1010 642.5 H1080" class="connector"/>
  <rect x="1017" y="618" width="47" height="28" rx="14" class="pill"/>
  <text x="1040.5" y="637" text-anchor="middle" class="connector-label">load</text>

  <path d="M1010 372.5 H1080" class="connector"/>
  <rect x="1016" y="348" width="49" height="28" rx="14" class="pill"/>
  <text x="1040.5" y="367" text-anchor="middle" class="connector-label">serve</text>

  <path d="M885 445 C885 505 1197.5 505 1197.5 570" class="connector"/>
  <rect x="998" y="486" width="117" height="28" rx="14" class="pill"/>
  <text x="1056.5" y="505" text-anchor="middle" class="connector-label">read / write</text>

  <path d="M1197.5 445 V570" class="connector"/>
  <rect x="1135" y="495" width="125" height="28" rx="14" class="pill"/>
  <text x="1197.5" y="514" text-anchor="middle" class="connector-label">aggregate</text>

  <!-- Legend -->
  <g>
    <rect x="72" y="765" width="288" height="72" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="102" cy="790" r="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="795" class="small">Compute / network</text>
    <circle cx="102" cy="815" r="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="120" y="820" class="small">Storage / database</text>
    <circle cx="250" cy="790" r="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="268" y="795" class="small">Processing</text>
  </g>
</svg>
