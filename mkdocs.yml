site_name: "Ray Jose – Systems Documentation Portfolio"
site_description: "Technical documentation for APIs, integration platforms, operational workflows, cloud systems, and engineering-driven environments."
site_url: "https://rayajose.github.io/writing-portfolio/"
use_directory_urls: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
  palette:
    scheme: default
    primary: white
    accent: blue

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Tutorials:
      - Your first feed ingestion: tutorials/first-feed.md
      - Create and retrieve an order: tutorials/create-and-retrieve-order.md

  - How-to:
      - Ingest a product feed end-to-end: api/ingest-product-feed.md
      - Debug failed feed runbook: operations/debug-product-feed.md

  - Architecture:
      - Platform overview: api/index.md
      - Get started: api/getting_started.md
      - Integration guide: api/integration-guide.md
      - Webhook integration guide: api/webhooks.md
      - Platform architecture and operational flow: architecture/platform-architecture.md
      - System architecture: api/architecture.md
      - Workflows: architecture/workflows.md

  - API reference:
      - Overview: api/api-reference.md
      - Feeds API: api/feeds.md
      - Jobs API: api/jobs.md
      - Products API: api/products.md
      - Orders API: api/orders.md
      - Customers API: api/customers.md
      - Analytics API: api/analytics.md
      - Health API: api/health.md
      - Errors: api/errors.md

  - SDKs:
      - Python SDK guide: api/sdk-python.md

  - Operations:
      - Overview: operations/index.md
      - SOPs: 
        - Partner onboarding: operations/onboarding.md
        - Deployment change procedure: operations/deployment-change-procedure.md
        - Edge gateway deployment guide: operations/edge-gateway-guide.md
      - Runbooks:
        - Debug failed feed runbook: operations/debug-product-feed.md
        - Backup and recovery runbook: operations/backup-recovery-procedure.md

  - Security policies:
      - Overview: security/index.md
      - Incident response plan: security/incident-response.md
      - API access control policy: security/api-access-control-policy.md
      - Customer data handling policy: security/customer-data-handling-policy.md
      - Data classification policy: security/data-classification-policy.md
      - Data retention and handling policy: security/data-retention-policy.md
      - Encryption policy: security/encryption-policy.md
      - Logging and monitoring policy: security/logging-monitoring-policy.md
      - Secrets management policy: security/secrets-management-policy.md
      - Secure software development lifecycle (SSDLC) policy: security/ssdlc-policy.md

  - Release notes: releases/release-history.md

  - Resources:
      - System Resource Model: api/resources.md
      - Architecture and deployment: architecture/index.md
      - Deployment guide: architecture/deployment.md
      - Screenshots: api/screenshots.md
      - CSV feed file specification: specs/csv-feed-file-spec.md

  - Profile: professional-profile.md

markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - glightbox

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rayajose
  meta:
    - property: og:title
      content: Ray Jose – Developer Documentation Portfolio
    - property: og:description
      content: API, integration, and data platform documentation portfolio.
    - property: og:image
      content: https://rayajose.github.io/writing-portfolio/assets/preview.png
    - property: og:type
      content: website