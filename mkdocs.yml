site_name: "Ray Jose – Systems Documentation Portfolio"
site_description: "Technical documentation for APIs, integration platforms, operational workflows, cloud systems, and engineering-driven environments."
site_url: "https://rayajose.github.io/writing-portfolio/"
use_directory_urls: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
  palette:
    scheme: default
    primary: white
    accent: blue

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Tutorials:
      - Overview: tutorials/index.md
      - Your first feed ingestion: tutorials/first-feed.md
      - Create and retrieve an order: tutorials/create-and-retrieve-order.md

  - How-to:
      - Overview: how-to/index.md
      - Ingest a product feed: how-to/ingest-product-feed.md
      - Create a customer: how-to/create-customer.md
      - Create an order: how-to/create-order.md

  - Architecture and concepts:
      - Overview: architecture/index.md
      - Get started: architecture/getting_started.md
      - Integration guide: architecture/integration-guide.md
      - Webhook integration guide: architecture/webhooks.md
      - Platform architecture and operational flow: architecture/platform-architecture.md
      - System architecture: architecture/architecture.md
      - Workflows: architecture/workflows.md

  - API reference:
      - Overview: api/index.md
      - Feeds: api/feeds.md
      - Jobs: api/jobs.md
      - Products: api/products.md
      - Customers: api/customers.md
      - Orders: api/orders.md
      - Health: api/health.md      
      - Analytics: api/analytics.md     
      - Errors: api/errors.md

  #- SDKs:
      #- Python SDK guide: sdk/sdk-python.md

  - Operations:
      - Overview: operations/index.md
      - SOPs: 
        - Partner onboarding: operations/onboarding.md
        - Application deployment procedure: operations/deployment-change-procedure.md
        - Database change procedure: operations/database-change-procedure.md
      - Runbooks:
        - Debug a product feed failure: operations/debug-product-feed.md
        - Backup and recovery: operations/backup-recovery-procedure.md

  - Security policies:
      - Overview: security/index.md
      - Incident response: security/incident-response.md
      - API access control: security/api-access-control-policy.md
      - Customer data handling: security/customer-data-handling-policy.md
      - Data classification: security/data-classification-policy.md
      - Data retention and handling: security/data-retention-policy.md
      - Encryption: security/encryption-policy.md
      - Logging and monitoring: security/logging-monitoring-policy.md
      - Secrets management: security/secrets-management-policy.md
      - Secure software development lifecycle (SSDLC): security/ssdlc-policy.md

  - Supporting materials:
      - Overview: index-supporting-material.md
      - System Resource Model: api/resources.md
      - Deployment guide: architecture/deployment.md
      - Edge gateway deployment guide: operations/edge-gateway-guide.md
      - Screenshots: api/screenshots.md
      - CSV feed file specification: specs/csv-feed-file-spec.md

  - Release notes: releases/release-history.md

  - Profile: professional-profile.md

markdown_extensions:
  - admonition
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - glightbox

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rayajose
  meta:
    - property: og:title
      content: Ray Jose – Developer Documentation Portfolio
    - property: og:description
      content: API, integration, and data platform documentation portfolio.
    - property: og:image
      content: https://rayajose.github.io/writing-portfolio/assets/preview.png
    - property: og:type
      content: website