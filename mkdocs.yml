site_name: "Ray Jose – Systems Documentation Portfolio"
site_description: "Technical documentation for APIs, integration platforms, operational workflows, cloud systems, and engineering-driven environments."
site_url: "https://rayajose.github.io/writing-portfolio/"
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
  palette:
    scheme: default
    primary: white
    accent: blue

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - API & Developer:
      - Overview: api/index.md
      - Platform overview: api/platform-overview.md
      - Get started: api/getting_started.md
      - Integration guide: api/integration-guide.md
      - Webhook integration guide: api/webhooks.md

      - Tutorials:
          - Your first feed ingestion: tutorials/first-feed.md

      - How-to guides:
          - Ingest a product feed end-to-end: api/ingest-product-feed.md
          - Debug a failed feed: operations/debug-product-feed.md

      - API reference:
          - Overview: api/api-reference.md
          - Feeds API: api/feeds.md
          - Jobs API: api/jobs.md
          - Products API: api/products.md
          - Orders API: api/orders.md
          - Analytics API: api/analytics.md
          - Health API: api/health.md
          - Errors: api/errors.md

      - SDKs:
          - Python SDK guide: api/sdk-python.md

      - Specifications:
          - CSV feed file specification: specs/csv-feed-file-spec.md

      - Resources:
          - Resources: api/resources.md
          - Screenshots: api/screenshots.md

  - Integration & Architecture:
      - Overview: architecture/index.md
      - Platform architecture: architecture/platform-architecture.md
      - Workflows: architecture/workflows.md
      - Deployment: architecture/deployment.md

  - SOPs & Operations:
      - Overview: operations/index.md
      - Partner onboarding SOP: operations/onboarding.md
      - Debug failed feed runbook: operations/debug-product-feed.md

  - Security & Compliance:
      - Overview: security/index.md
      - Incident response plan: security/incident-response.md

  - About: about.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rayajose
  meta:
    - property: og:title
      content: Ray Jose – Developer Documentation Portfolio
    - property: og:description
      content: API, integration, and data platform documentation portfolio.
    - property: og:image
      content: https://rayajose.github.io/writing-portfolio/assets/preview.png
    - property: og:type
      content: website