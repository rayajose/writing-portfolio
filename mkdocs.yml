site_name: "Writing Portfolio"
site_url: "https://rayajose.github.io/writing-portfolio/"

theme:
  name: "material"
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

nav:
  - "Home": "index.md"

  - "API & Developer Docs":
      - "Overview": "api/index.md"
      - "Getting Started": "getting_started.md"
      - "Workflows": "workflows.md"
      - "Products Endpoint": "products.md"
      - "SDK Python": "sdk-python.md"

  - "SOPs & Operations":
      - "Partner Feed Onboarding": "sop/onboarding.md"

  - "Security & Compliance":
      - "Incident Response Plan": "security/incident-response.md"

  - "Integration & Architecture":
      - "System Overview": "architecture/index.md"

  - "About": "about.md"

markdown_extensions:
  - admonition
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rayajose