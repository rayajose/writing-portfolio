site_name: "Ray Jose – Systems Documentation Portfolio"
site_description: "Technical documentation for APIs, integration platforms, operational workflows, cloud systems, and engineering-driven environments."
site_url: "https://rayajose.github.io/writing-portfolio/"
use_directory_urls: true

theme:
  name: "material"
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy

  palette:
    - scheme: default
    - primary: white
    - accent: blue


extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - API & Developer Docs:
      - Overview: api/index.md
      - Get Started: api/getting_started.md
      - Integration guide: api/integration-guide.md

      - Tutorials:
          - Your First Feed Ingestion: tutorials/first-feed.md

      - How-To Guides:
          - Ingest a Product Feed End-to-End: api/ingest-product-feed.md
          - Debug a Failed Feed: api/debug-product-feed.md
          - Partner Feed Onboarding: sop/onboarding.md

      - API Reference:
          - Overview: api/api-reference.md
          - Feeds API: api/feeds.md
          - Jobs API: api/jobs.md
          - Products API: api/products.md
          - Orders API: api/orders.md
          - Health API: api/health.md
          - Analytics API: api/analytics.md
          - Errors: api/errors.md

      - Concepts:
          - Architecture: api/architecture.md
          - Workflows: api/workflows.md
          - Deployment: api/deployment.md

      - SDKs:
          - Python SDK Guide: api/sdk-python.md

      - Specifications:
          - CSV Feed File Specification: sop/csv-feed-file-spec.md

      - Supporting Materials:
          - Resources: api/resources.md
          - Screenshots: api/screenshots.md

  - Operations & Systems:
      - System Architecture and Operational Flow: architecture/index.md
    #  - Edge Gateway Deployment and Service Guide: operations/edge-gateway-guide.md

  - Security & Compliance:
      - Incident Response Plan: security/incident-response.md

  - About: about.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rayajose

  meta:
    - property: og:title
      content: Ray Jose – Developer Documentation Portfolio
    - property: og:description
      content: API, integration, and data platform documentation portfolio.
    - property: og:image
      content: https://rayajose.github.io/writing-portfolio/assets/preview.png
    - property: og:type
      content: website