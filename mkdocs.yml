site_name: "Ray Jose – Technical Writing Portfolio"
site_description: ""
site_url: "https://rayajose.github.io/writing-portfolio/"
use_directory_urls: true

theme:
  name: "material"
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue gey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

nav:
  - "Home": "index.md"

  - API & Developer Docs:
      - Overview: api/index.md
      - Getting Started: api/getting_started.md
      - Workflows: api/workflows.md

      - Architecture:
          - Overview: api/architecture.md
          - Deployment: api/deployment.md

      - SDKs:
          - Python SDK Guide: api/sdk-python.md

      - API Reference:
          - Overview: api/api-reference.md
          - Feeds API: api/feeds.md
          - Products API: api/products.md
          - Jobs API: api/jobs.md
          - Analytics API: api/analytics.md
          - Errors: api/errors.md

      - Supporting Materials:
          - Resources: api/resources.md
          - Screenshots: api/screenshots.md

  - "SOPs & Operations":
      - "Partner Feed Onboarding": "sop/onboarding.md"
      - "CSV Feed File Specification": "sop/csv-feed-file-spec.md"

  - "Security & Compliance":
      - "Incident Response Plan": "security/incident-response.md"

  - "About": "about.md"

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rayajose
  meta:
    - property: og:title
      content: Ray Jose – Developer Documentation Portfolio
    - property: og:description
      content: API, integration, and data platform documentation portfolio.
    - property: og:image
      content: https://rayajose.github.io/writing-portfolio/docs/assets/preview.png
    - property: og:type
      content: website