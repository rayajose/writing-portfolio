site_name: "Writing Portfolio"
site_url: "https://rayajose.github.io/writing-portfolio/"

theme:
  name: "material"
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - "Home": "index.md"

  - "API & Developer Docs":
      - "Overview": "api/index.md"
      - "Getting Started": "api/getting_started.md"
      - "Workflows": "api/workflows.md"
      - "Python SDK Guide": "api/sdk-python.md"
      - "Architecture": "api/architecture.md"
      - "Feeds API": "api/feeds.md"
      - "Products API": "api/products.md"
      - "Jobs API": "api/jobs.md"
      - "Analytics API": "api/analytics.md"
      - "Errors": "api/errors.md"
      - "Deployment": "api/deployment.md"
      - "Resources": "api/resources.md"
      - "Screenshots": "api/screenshots.md"

  - "SOPs & Operations":
      - "Partner Feed Onboarding": "sop/onboarding.md"
      - "CSV Feed File Specification": "sop/csv-feed-file-spec.md"

  - "Security & Compliance":
      - "Incident Response Plan": "security/incident-response.md"

  - "About": "about.md"

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rayajose